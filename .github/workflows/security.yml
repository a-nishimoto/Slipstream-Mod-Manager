name: Dependencies

# Kept separate from Build on purpose. A new advisory can be published against
# code that has not changed, so this needs a schedule -- and when it fires it
# should not look like the build broke.
on:
  schedule:
    # Mondays, 09:00 UTC.
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'pom.xml'
      - '.github/workflows/security.yml'
      - '.github/scripts/osv_check.py'
  pull_request:
    paths:
      - 'pom.xml'
  workflow_dispatch:

jobs:
  osv:
    name: OSV advisory scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Scans the RESOLVED dependency tree rather than pom.xml, so transitives
      # are covered. Fails the job when anything is found.
      - name: Check dependencies against OSV
        run: python3 .github/scripts/osv_check.py
